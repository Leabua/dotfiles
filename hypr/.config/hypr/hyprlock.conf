source = /home/leabua/.cache/hypr/hyprlock-colors.conf

# one column down the middle of the screen; x offsets below are relative to the screen centre
# column is 320 wide -> edges at -160 / +160
$col      = 0
$sans     = SF Pro Display
$glyphs   = Maple Mono NF
$row_fill = rgba(10,12,20,0.55)
$row_edge = rgba(255,255,255,0.14)

general {
    ignore_empty_input = true
    hide_cursor = true
}

# the bar's easeOut curve (Globals.easeOut) -> responds instantly, lands softly; speeds are in 100ms steps
animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 2, easeOut
    animation = fadeOut, 1, 1.5, easeOut
    animation = inputFieldColors, 1, 1.5, easeOut
    animation = inputFieldDots, 1, 1, easeOut
}

# your original blur, a touch darker so the column reads on bright wallpapers without shadows
background {
    monitor =
    color = $base
    path = /home/leabua/Wallpapers/140824539_p0.png
    blur_passes = 2
    blur_size = 5
    brightness = 0.78
}

# vertical rhythm (block centred on screen): clock | 26 | date | 28 | avatar | 40 | password row | 18 | status

# ----- avatar: between the date and the password row -----
image {
    monitor =
    path = /home/leabua/dotfiles/assets/spidey_pfp_square.png
    size = 240
    rounding = -1
    border_size = 0   # no outlines anywhere; the field's ring only appears to report state
    reload_time = -1
    position = $col, -17
    halign = center
    valign = center
    zindex = 5
}

# ----- clock + date -----
label {
    monitor =
    # New York Extra Large Semibold: Apple's display serif (an iOS lock-screen option) over the sans date
    text = <span font_weight="600">$TIME</span>
    font_family = New York Extra Large
    font_size = 108               # digits ~76px tall, same height as the old pixel clock
    color = $accent
    position = $col, 213
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    # regular weight, a size down and dimmed -> supports the clock instead of competing with it
    text = cmd[update:60000] date +"<span font_weight='400' fgalpha='72%%'>%A %-d %B</span>"
    font_family = $sans
    font_size = 16
    color = $text
    position = $col, 140
    halign = center
    valign = center
    zindex = 5
}

# ----- password row: field + round enter button, together the column's 320px (272 + 8 gap + 40) -----
# the ring only lights up to report a state
input-field {
    monitor =
    size = 272, 40
    position = -24, -197    # left edge at -160, centre -24
    halign = center
    valign = center

    inner_color = $row_fill
    outer_color = rgba(00000000)   # invisible at rest -> no border
    outline_thickness = 2          # only shows when it lights up: checking / wrong password / CAPS LOCK (Esc key, caps:swapescape)
    rounding = -1    # full pill, same curve as the enter button

    font_family = $sans
    font_color = $text
    # key glyph + label centred as one unit, 14px; trailing spaces keep the wide glyph unclipped
    placeholder_text = <span size="14336" font_weight="500" fgalpha="60%"><span font_family="Maple Mono NF">󰌆 </span> Password</span>

    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1

    check_color = $accent
    fail_color = rgb(f38ba8)     # Globals.criticalColor
    fail_text = <span font_weight="500">$FAIL ($ATTEMPTS)</span>
    capslock_color = rgb(f9e2af) # Globals.warningColor

    fade_on_empty = false
    shadow_passes = 0
    zindex = 10
}

# ----- enter button: a 40px circle closing the row; Enter submits, the arrow says so -----
shape {
    monitor =
    size = 40, 40
    color = $accent
    rounding = -1
    border_size = 0
    position = 140, -197    # right edge at +160, centre 140
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = <span font_weight="600">→</span>
    font_family = $sans
    font_size = 18
    color = $on_accent
    position = 140, -197
    halign = center
    valign = center
    zindex = 3
}

# ----- weather + battery: one line just under the password row, 16px apart, centred on the column -----
label {
    monitor =
    text = cmd[update:900000] bash -c 'w=$(curl -s --max-time 6 "wttr.in/?format=%C|%t" 2>/dev/null); cond="${w%%|*}"; temp="${w##*|}"; temp="${temp/+/}"; [ -z "$temp" ] && temp="--"; cl=$(echo "$cond" | tr "[:upper:]" "[:lower:]"); case "$cl" in *thunder*|*storm*) u=f0593;; *snow*|*sleet*|*blizzard*|*ice*) u=f0598;; *rain*|*drizzle*|*shower*) u=f0597;; *fog*|*mist*|*haze*|*overcast*) u=f0591;; *partly*) u=f0595;; *cloud*) u=f0590;; *clear*|*sunny*) h=$(date +%H); if [ "$h" -ge 6 ] && [ "$h" -lt 19 ]; then u=f0599; else u=f0594; fi;; *) u=f0590;; esac; printf "<span font_weight=\"600\"><span font_family=\"Maple Mono NF\">%b</span>  %s</span>" "\U000$u" "$temp"'
    font_family = $sans
    font_size = 14
    color = $text
    position = -39, -243
    halign = center
    valign = center
    zindex = 5
}

# battery tinted like the bar: green charging past 80, amber <=20, red <=10, otherwise accent
label {
    monitor =
    text = cmd[update:5000] bash -c 'c=$(cat /sys/class/power_supply/BAT0/capacity); s=$(cat /sys/class/power_supply/BAT0/status); t=""; if [ "$s" = Charging ]; then g=f0084; [ "$c" -ge 80 ] && t="##4fd6be"; else n=$((c / 10)); if [ $n -ge 10 ]; then g=f0079; elif [ $n -eq 0 ]; then g=f008e; else g=$(printf %x $((0xf007a + n - 1))); fi; if [ "$c" -le 10 ]; then t="##f38ba8"; elif [ "$c" -le 20 ]; then t="##f9e2af"; fi; fi; o="<span font_family=\"Maple Mono NF\">$(printf "%b" "\U000$g")</span> $c%"; [ -n "$t" ] && o="<span foreground=\"$t\">$o</span>"; echo "<span font_weight=\"600\">$o</span>"'
    font_family = $sans
    font_size = 14
    color = $accent
    position = 40, -243
    halign = center
    valign = center
    zindex = 5
}

