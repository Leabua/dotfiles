"$schema" = 'https://starship.rs/config-schema.json'

# Port of zsh/.p10k.zsh: one line, no background, arrow before directory/Git.
add_newline = false
format = '$character$directory$git_branch$git_commit$git_status$git_state '
right_format = ''

[character]
success_symbol = '[->](green)'
error_symbol = '[->](red)'

[directory]
format = '[$path]($style)[$read_only]($read_only_style)'
style = 'bold cyan'
read_only = ' '
read_only_style = '110'
truncation_length = 1
truncation_symbol = ''
truncate_to_repo = false

[git_branch]
format = ' [git:\(](73)[$branch](9)[\)](73)([:$remote_branch](73))'
truncation_length = 32
truncation_symbol = '…'

[git_commit]
format = ' [@$hash( #$tag)](73)'
commit_hash_length = 8
tag_disabled = false
only_detached = true

[git_status]
format = '$ahead_behind$stashed$conflicted$staged$modified$untracked$deleted$renamed'
ahead = ' [⇡$count](73)'
behind = ' [⇣$count](73)'
diverged = ' [⇣$behind_count⇡$ahead_count](73)'
stashed = ' [*$count](73)'
conflicted = ' [~$count](red)'
staged = ' [+$count](purple)'
modified = ' [!$count](purple)'
untracked = ' [?$count](purple)'
# Starship counts these separately; keep them visible alongside modifications.
deleted = ' [!$count](purple)'
renamed = ' [»$count](purple)'

[git_state]
format = ' [$state( $progress_current/$progress_total)](red)'
